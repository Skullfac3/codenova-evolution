<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1b1325" />
    <title>CodeNova Evolution</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      /* Pantalla de carga estática: se ve de inmediato, antes de que el
         JavaScript baje y arranque React. React vacía #root al montar
         la app, así que el splash desaparece solo. Sin esto, abrir la
         app era mirar una pantalla en blanco varios segundos. */
      html, body { margin: 0; background: #1b1325; }
      .splash {
        min-height: 100vh; min-height: 100dvh;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #1b1325; color: #f3e9dc;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center;
        padding: 24px; box-sizing: border-box;
      }
      .splash-logo { color: #ff8a3d; font-size: 28px; font-weight: 800; letter-spacing: 2px; }
      .splash-bar { width: min(220px, 70vw); height: 10px; background: #2a1f35; border: 2px solid #4a3a5c; overflow: hidden; }
      .splash-bar span { display: block; height: 100%; width: 40%; background: #7bd389; animation: splash-carga 1.2s ease-in-out infinite alternate; }
      @keyframes splash-carga { from { margin-left: 0; } to { margin-left: 60%; } }
      .splash-text { color: #b9a9c9; font-size: 15px; margin: 0; }
      .splash-retry { display: none; text-align: center; max-width: 300px; }
      .splash-retry p { color: #f3e9dc; font-size: 15px; margin: 0 0 12px; }
      .splash-retry button { font: inherit; font-weight: 800; background: #ff8a3d; color: #1b1325; border: 2px solid #ff8a3d; padding: 12px 20px; min-height: 48px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <div class="splash-logo">CodeNova</div>
        <div class="splash-bar" aria-hidden="true"><span></span></div>
        <p class="splash-text">Cargando tu aventura…</p>
        <div class="splash-retry" id="splash-retry">
          <p>Está tardando más de lo normal. Puede ser una versión vieja guardada en el teléfono.</p>
          <button type="button" id="splash-retry-btn">Reintentar</button>
        </div>
      </div>
    </div>
    <noscript><p style="color:#f3e9dc;font-family:system-ui,sans-serif;text-align:center;padding:24px">CodeNova necesita JavaScript para jugar.</p></noscript>
    <script>
      // Red de seguridad, antes de que arranque la app:
      // 1) guarda los errores de JavaScript para poder mostrarlos;
      // 2) si a los 12 s sigue la pantalla de carga, ofrece «Reintentar»;
      // 3) si la pantalla queda vacía (la app tronó al dibujarse), muestra
      //    el error y «Reintentar» en vez de dejarla en blanco.
      // «Reintentar» borra la caché de la app y recarga; no toca la partida.
      (function () {
        var errors = [];
        window.addEventListener('error', function (e) {
          errors.push((e.message || 'Error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          errors.push('Promesa rechazada: ' + (r && r.message ? r.message : String(r)));
        });
        function clearAndReload() {
          var jobs = [];
          if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
        }
        function showDetail(box) {
          if (!errors.length) return;
          var pre = document.createElement('pre');
          pre.textContent = errors.slice(-3).join('\n');
          pre.setAttribute('style', 'white-space:pre-wrap;word-break:break-word;color:#ffb3a6;font-size:12px;text-align:left;margin:12px 0 0');
          box.appendChild(pre);
        }
        setTimeout(function () {
          var retry = document.getElementById('splash-retry');
          if (!retry || !document.querySelector('#root .splash')) return;
          retry.style.display = 'block';
          document.getElementById('splash-retry-btn').onclick = clearAndReload;
          showDetail(retry);
        }, 12000);
        var checks = 0;
        var timer = setInterval(function () {
          checks++;
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0 && !document.getElementById('rescate')) {
            var box = document.createElement('div');
            box.id = 'rescate';
            box.setAttribute('role', 'alert');
            box.setAttribute('style', 'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:#1b1325;color:#f3e9dc;font-family:system-ui,sans-serif');
            box.innerHTML = '<div class="splash-logo">CodeNova</div><p style="margin:0;max-width:320px">Algo falló al abrir la app. Toca «Reintentar»: tu partida está a salvo.</p>';
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = 'Reintentar';
            btn.setAttribute('style', 'font:inherit;font-weight:800;background:#ff8a3d;color:#1b1325;border:2px solid #ff8a3d;padding:12px 20px;min-height:48px');
            btn.onclick = clearAndReload;
            box.appendChild(btn);
            showDetail(box);
            document.body.appendChild(box);
          }
          if (checks >= 60) clearInterval(timer);
        }, 1000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
